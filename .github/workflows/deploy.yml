
name: Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy1:

    runs-on: ubuntu-latest


    steps:
    - uses: actions/checkout@v4
    - run: docker build . -t johnsonjw/next-js-app
    - run: echo "${{secrets.DOCKERHUB_PASSWORD}}" | docker login --username ${{secrets.DOCKERUSER}} --password-stdin
    - run: docker push johnsonjw/next-js-app:latest